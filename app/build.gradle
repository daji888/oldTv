plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.github.tvbox.osc'
    compileSdkVersion = 36

    defaultConfig {
        applicationId = 'com.github.tvbox.osc.dj'
        minSdkVersion = 23
        targetSdkVersion = 30
        versionCode = 1
        versionName = '1.0.0'
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled = false

            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled = false

            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def CommitTime = variant.versionName
            // 构建自定义文件名
            def fileName = "TVBox-${CommitTime}.apk"
            outputFileName = fileName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ['*.jar', '*.aar'])
    implementation project(":quickjs")
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'com.blankj:utilcodex:1.31.1'
    implementation 'com.github.albfernandez:juniversalchardet:2.5.0'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50'  //别升级
    implementation 'com.github.getActivity:XXPermissions:26.5'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'  //2022年
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'  //2020年
    implementation 'com.lzy.net:okgo:3.0.4'  //2017年
    implementation 'com.orhanobut:hawk:2.0.1'  //2018年
    implementation 'com.owen:tv-recyclerview:3.0.0'  //2020年
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'  //ApiConfig & OkGoHelper & FileUtils
    implementation 'com.squareup.okio:okio:3.16.4'
    implementation ('com.thoughtworks.xstream:xstream:1.4.21') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'me.jessyan:autosize:1.2.1'  //2020年
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'  //2021年
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.greenrobot:eventbus:3.3.1'  //2021年
    implementation 'org.nanohttpd:nanohttpd:2.3.1'  //2016年
    implementation 'org.jsoup:jsoup:1.21.2'
    
    def media3_version = "1.8.0"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-datasource-rtmp:$media3_version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3_version"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$media3_version"
    
    configurations {
        configureEach {
            exclude group: 'xpp3', module: 'xpp3'
        }
    }
}
